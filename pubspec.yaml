name: random_choice
description: "An app that randomly choose things for you." 
version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: 1.4.0
  shared_preferences: ^2.5.3
  logger: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/random_choice_icon.png"
  adaptive_icon_background: "#667eea" 
  adaptive_icon_foreground: "assets/random_choice_icon.png"
  adaptive_icon_foreground_inset: 35
  windows: 
    generate: true
    icon_path: "assets/random_choice_icon.png"
  